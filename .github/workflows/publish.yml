# Publish only the exact tested artifact from an authorized protected version tag.
# Package identity remains upstream; this fork is NOT an authorized npm publisher.
# One-time npm Trusted Publisher setup (upstream package administrator only):
#   Organization or user : xcisxc29
#   Repository           : dsh-qq-plugin
#   Workflow filename    : publish.yml
#   Environment          : npm-release
# Protect npm-release with reviewers and restricted version tags; bind npm to it.
# Protect v* tags against unauthorized creation, updates and deletion. Then explicitly
# set NPM_PUBLISH_ENABLED=true in the authorized upstream repository.
# Actions → Publish → Run workflow performs validation/packing only, for every ref.

name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax-check every source file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          count=0
          for file in **/*.js **/*.mjs; do
            case "$file" in
              *node_modules*) continue ;;
            esac
            node --check "$file"
            count=$((count + 1))
          done
          echo "parsed $count .js/.mjs files"

      - name: Host-side checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify.mjs.out"

      # The send path is the one piece of logic whose failure is silent, and `verify.mjs` cannot
      # reach it because it needs a bot; `verify-send-path.mjs` substitutes one through a module
      # resolution hook. It ran in CI only, which is how a release could be gated by a strictly
      # weaker set of checks than a pull request.
      - name: Send-path checks (fake transport, real plugin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify-send-path.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify-send-path.mjs.out"

      - name: Client-side checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify-client.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify-client.mjs.out"

      # The numbers printed in README.md, README.zh.md and docs/RELEASING.md are typed by hand.
      # Release is where a stale one matters most, so the same comparison CI runs runs here, against
      # the logs the three steps above just wrote. The same checker also compares this file's
      # Trusted Publisher block with `package.json` — the four fields a user copies by hand, whose
      # only other symptom is a 403 during the publish below.
      - name: The documented counts match the run, and the workflow names the real repository
        run: node tools/check-doc-counts.mjs --logs "$RUNNER_TEMP/dsh-qq-doc-counts"

      - name: Security regression checks (offline)
        run: |
          node scripts/verify-authorization.mjs
          node scripts/verify-security-config.mjs

      - name: DSH 0.2.1-rc.5 credential service contract
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/dsh-compat" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-credentials-local@0.2.1-rc.5
          DSH_COMPAT_NODE_MODULES="$RUNNER_TEMP/dsh-compat/node_modules" node scripts/verify-host-contract.mjs

      - name: No name is used without being imported
        run: node tools/check-unbound.mjs .

      - name: No import is left unused
        run: node tools/check-unused-imports.mjs .

      - name: The tarball carries what users need
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(npm pack --dry-run 2>&1)
          missing=0
          for required in \
            lib/runtime.js lib/router.js index.js client.js cordis.patch.yml \
            README.md README.zh.md LICENSE \
            docs/HANDBOOK-USER.md docs/POSTMORTEM.md docs/RELEASING.md \
            docs/SETTINGS-CONTRACT.md docs/STEP3-能力调研与实现规格.md \
            tools/check-cross-plugin.mjs tools/check-doc-counts.mjs \
            tools/check-unbound.mjs tools/check-unused-imports.mjs
          do
            if ! grep -qF "$required" <<<"$manifest"; then
              echo "missing from the tarball: $required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- npm pack --dry-run said ---"
            echo "$manifest"
            exit 1
          fi
          echo "tarball carries the entry points, the docs and the checkers"

      - name: Check version tag before packing
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Pack exactly one verified artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qq-release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/qq-release" > "$RUNNER_TEMP/qq-pack.json"
          node --input-type=module <<'JS'
          import { readFileSync, renameSync, appendFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join, basename } from 'node:path'
          const packs = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'qq-pack.json'), 'utf8'))
          if (packs.length !== 1 || basename(packs[0].filename) !== packs[0].filename) throw new Error('Expected one package')
          const source = join(process.env.RUNNER_TEMP, 'qq-release', packs[0].filename)
          const digest = createHash('sha256').update(readFileSync(source)).digest('hex')
          renameSync(source, join(process.env.RUNNER_TEMP, 'qq-release', 'release.tgz'))
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid version')
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${digest}\nversion=${version}\n`)
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/qq-release/release.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected &&
      github.repository == 'xcisxc29/dsh-qq-plugin' && vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, or repository script runs in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/qq-release
      - name: Verify artifact and publish without lifecycle scripts
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        working-directory: ${{ runner.temp }}/qq-release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_REF_NAME" = "v$EXPECTED_VERSION"
          printf '%s  release.tgz\n' "$EXPECTED_DIGEST" | sha256sum --check --strict
          tar -xOf release.tgz package/package.json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const p = JSON.parse(input);
              if (p.name !== "dsh-qq-plugin" || p.version !== process.env.EXPECTED_VERSION) process.exit(1);
            });'
          npm publish ./release.tgz --ignore-scripts --provenance --access public
